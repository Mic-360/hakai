[package]
name = "hakai-core"
version = "1.0.0"
edition = "2021"
description = "The strongest filesystem engine for hakai — \"Throughout the filesystem, I alone am the honored one.\""

[[bin]]
name = "hakai"
path = "src/main.rs"

[features]
default = []
ipc = ["dep:tokio"]

[dependencies]
tokio = { version = "1", features = ["full"], optional = true }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
crossbeam-channel = "0.5"
ignore = "0.4"
humansize = "2"
toml = "0.8"
dirs = "5"
chrono = "0.4"
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3"
